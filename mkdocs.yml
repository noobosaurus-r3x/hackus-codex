site_name: Hackus Codex
site_description: A clean, practical knowledge base for bug bounty hunters and pentesters
site_url: https://hackus-codex.online

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    logo: material/skull-crossbones
    repo: fontawesome/brands/github
    tag:
      critical: material/fire
      high: material/alert
      medium: material/alert-circle
      low: material/information
      server-side: material/server
      client-side: material/monitor
      logic: material/brain
      infra: material/cloud
    admonition:
      note: material/note-text
      tip: material/lightbulb-on
      warning: material/alert
      danger: material/fire
      bug: material/bug
      example: material/code-tags
      quote: material/format-quote-close

extra_css:
  - stylesheets/terminal.css
  - stylesheets/cards.css

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - tags:
      tags_file: tags.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  tags:
    critical: critical
    high: high
    medium: medium
    low: low
    server-side: server-side
    client-side: client-side
    logic: logic
    infra: infra
  generator: false

